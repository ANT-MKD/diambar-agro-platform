<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pas de connexion · Diambar Agro</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
        background: #f6faf7;
        color: #0f172a;
        text-align: center;
      }
      .logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        border-radius: 18px;
        background: linear-gradient(135deg, #10b981, #047857);
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: #475569;
        line-height: 1.5;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        font-size: 16px;
        font-weight: 600;
        background: #059669;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true"></div>
      <h1>Pas de connexion</h1>
      <p>
        Diambar Agro a besoin d'Internet. Vérifiez les données mobiles ou le Wi-Fi, puis réessayez.
      </p>
      <button onclick="history.length > 1 ? history.back() : location.reload()">Réessayer</button>
    </main>
  </body>
</html>
